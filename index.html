<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>囍 · 婚禮快問快答</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Noto+Serif+TC:wght@500;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #c83b46;
      --red-dark: #982d39;
      --orange: #e77a42;
      --yellow: #eebd59;
      --green: #55785f;
      --cream: #fff8e9;
      --ink: #302923;
      --ink-light: #6c6056;
      --gold: #c79845;
      --shadow: 0 18px 50px rgba(92, 52, 36, 0.15);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Sans TC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(238, 189, 89, .22), transparent 25%),
        radial-gradient(circle at 85% 85%, rgba(200, 59, 70, .12), transparent 30%),
        var(--cream);
      overflow-x: hidden;
    }

    button { font: inherit; }
    .hidden { display: none !important; }
    .page { position: relative; z-index: 1; min-height: 100vh; width: 100%; }
    .serif { font-family: "Noto Serif TC", serif; }

    /* 背景裝飾 */
    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .circle {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(200, 59, 70, .12);
    }
    .circle.one { width: 330px; height: 330px; left: -170px; top: 10%; }
    .circle.two {
      width: 240px;
      height: 240px;
      right: -100px;
      bottom: 5%;
      border-color: rgba(85, 120, 95, .15);
    }
    .flower {
      position: absolute;
      font-family: "Noto Serif TC", serif;
      font-size: 100px;
      color: rgba(200, 59, 70, .055);
      user-select: none;
    }
    .flower.f1 { top: 40px; right: 5%; transform: rotate(-10deg); }
    .flower.f2 {
      bottom: 10px;
      left: 5%;
      color: rgba(85, 120, 95, .07);
      transform: rotate(16deg);
    }

    /* 首頁 */
    #homePage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
    }
    .home-card {
      width: min(960px, 100%);
      min-height: 620px;
      padding: 70px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: rgba(255, 253, 245, .93);
      border: 1px solid rgba(151, 82, 57, .15);
      border-radius: 36px;
      box-shadow: var(--shadow);
    }
    .home-card::before,
    .home-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }
    .home-card::before {
      width: 430px;
      height: 430px;
      top: -250px;
      right: -100px;
      background: var(--red);
      opacity: .045;
    }
    .home-card::after {
      width: 280px;
      height: 280px;
      bottom: -170px;
      left: -80px;
      background: var(--green);
      opacity: .05;
    }
    .seal {
      width: 82px;
      height: 82px;
      margin-bottom: 28px;
      display: grid;
      place-items: center;
      background: var(--red);
      color: white;
      border-radius: 18px 18px 28px 18px;
      font-family: "Noto Serif TC", serif;
      font-size: 42px;
      font-weight: 900;
      box-shadow: 7px 8px 0 rgba(151, 45, 57, .12);
      transform: rotate(-4deg);
    }
    .small-en {
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .home-title {
      margin: 8px 0 6px;
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .home-title .accent { color: var(--red); }
    .home-subtitle {
      max-width: 580px;
      margin: 20px auto 36px;
      color: var(--ink-light);
      font-size: 17px;
      line-height: 1.9;
    }
    .couple-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 38px;
    }
    .couple-tag {
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }
    .couple-tag.bride { background: rgba(200, 59, 70, .11); color: var(--red); }
    .couple-tag.groom { background: rgba(85, 120, 95, .12); color: var(--green); }
    .heart { color: var(--orange); font-size: 20px; }
    .start-btn {
      min-width: 250px;
      padding: 18px 32px;
      border: 0;
      border-radius: 18px;
      background: var(--red);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(200, 59, 70, .23);
      transition: .2s ease;
    }
    .start-btn:hover {
      transform: translateY(-3px);
      background: var(--red-dark);
      box-shadow: 0 17px 32px rgba(200, 59, 70, .28);
    }
    .start-btn span { margin-left: 6px; }

    /* 遊戲頁 */
    #gamePage { padding: 24px; }
    .game-shell {
      width: min(1180px, 100%);
      min-height: calc(100vh - 48px);
      margin: auto;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }
    .home-mini-btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 15px;
      background: rgba(255, 255, 255, .72);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(70, 49, 36, .08);
      transition: .2s ease;
    }
    .home-mini-btn:hover { transform: translateY(-2px); }
    .progress-wrap { flex: 1; max-width: 620px; }
    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--ink-light);
      font-size: 12px;
      font-weight: 700;
    }
    .progress-bar {
      width: 100%;
      height: 9px;
      overflow: hidden;
      background: rgba(93, 75, 59, .1);
      border-radius: 999px;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow));
      border-radius: inherit;
      transition: width .45s ease;
    }
    .question-counter {
      min-width: 88px;
      text-align: right;
      color: var(--red);
      font-family: "Noto Serif TC", serif;
      font-weight: 800;
    }

    /* 題目卡 */
    .question-card {
      flex: 1;
      padding: 45px 40px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: rgba(255, 253, 246, .92);
      border: 1px solid rgba(103, 72, 47, .12);
      border-radius: 32px;
      box-shadow: var(--shadow);
    }
    .question-card::before {
      content: "囍";
      position: absolute;
      top: -25px;
      right: 15px;
      color: rgba(200, 59, 70, .035);
      font-family: "Noto Serif TC", serif;
      font-size: 200px;
      font-weight: 900;
    }
    .q-label { margin-bottom: 22px; text-align: center; }
    .q-label span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 15px;
      background: rgba(200, 59, 70, .09);
      color: var(--red);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }
    .question {
      max-width: 850px;
      margin: 0 auto;
      text-align: center;
      font-family: "Noto Serif TC", serif;
      font-size: clamp(26px, 5vw, 46px);
      font-weight: 800;
      line-height: 1.55;
    }

    /* 新娘左、新郎右 */
    .choices {
      width: min(940px, 100%);
      margin: 42px auto 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 22px;
    }
    .choice {
      min-height: 205px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      position: relative;
      border: 2px solid transparent;
      border-radius: 30px;
      transition: transform .35s ease, opacity .35s ease, box-shadow .35s ease, border .35s ease;
    }
    .choice-bride {
      justify-content: flex-start;
      background: linear-gradient(120deg, rgba(200, 59, 70, .16), rgba(255, 255, 255, .78));
    }
    .choice-groom {
      justify-content: flex-end;
      background: linear-gradient(240deg, rgba(85, 120, 95, .18), rgba(255, 255, 255, .78));
    }
    .person-photo {
      width: 180px;
      height: 210px;
      flex-shrink: 0;
      align-self: flex-end;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 13px 12px rgba(55, 38, 28, .16));
      transition: transform .35s ease, filter .35s ease;
    }
    .bride-photo { margin-left: -18px; margin-right: 14px; }
    .groom-photo { margin-left: 14px; margin-right: -18px; }
    .person-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }
    .bride-info { text-align: left; }
    .groom-info { text-align: right; }
    .choice-title {
      font-family: "Noto Serif TC", serif;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.2;
    }
    .choice-name {
      margin-top: 7px;
      color: var(--ink-light);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    .vs {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 3;
      background: var(--ink);
      color: white;
      border-radius: 50%;
      font-family: "Noto Serif TC", serif;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 16px rgba(48, 41, 35, .14);
    }

    /* 揭曉答案 */
    .choice.answer {
      transform: translateY(-8px) scale(1.035);
      border-color: var(--gold);
      box-shadow: 0 18px 30px rgba(128, 87, 44, .16);
    }
    .choice.answer .person-photo {
      transform: scale(1.09) translateY(-4px);
      filter: drop-shadow(0 18px 16px rgba(55, 38, 28, .22));
    }
    .choice.wrong { opacity: .3; transform: scale(.96); }
    .choice.answer::after {
      content: "答案";
      position: absolute;
      top: 14px;
      padding: 5px 11px;
      background: var(--red);
      color: white;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }
    .choice-bride.answer::after { right: 14px; }
    .choice-groom.answer::after { left: 14px; }

    .answer-message {
      margin: 32px auto 0;
      text-align: center;
      animation: answerIn .55s cubic-bezier(.2, .8, .2, 1);
    }
    @keyframes answerIn {
      from { opacity: 0; transform: translateY(15px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .answer-title {
      margin-bottom: 7px;
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .18em;
    }
    .answer-result {
      font-family: "Noto Serif TC", serif;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 900;
    }
    .answer-note { margin-top: 8px; color: var(--ink-light); font-size: 14px; }

    /* 控制按鈕 */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    .control-btn {
      padding: 14px 22px;
      border: 0;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease;
    }
    .control-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .control-btn:disabled { opacity: .25; cursor: default; }
    .btn-secondary { background: rgba(48, 41, 35, .08); color: var(--ink); }
    .btn-reveal {
      min-width: 190px;
      background: var(--red);
      color: white;
      box-shadow: 0 10px 20px rgba(200, 59, 70, .2);
    }
    .btn-next { background: var(--green); color: white; }

    @media (max-width: 700px) {
      #homePage { padding: 18px 14px; }
      .home-card { min-height: calc(100vh - 36px); padding: 50px 20px; border-radius: 26px; }
      #gamePage { padding: 14px; }
      .game-shell { min-height: calc(100vh - 28px); }
      .topbar { margin-bottom: 14px; }
      .progress-info { display: none; }
      .question-counter { min-width: auto; font-size: 13px; }
      .question-card { padding: 30px 14px 22px; border-radius: 26px; }
      .q-label { margin-bottom: 16px; }
      .question { font-size: clamp(24px, 8vw, 34px); }
      .choices { grid-template-columns: 1fr 38px 1fr; gap: 7px; margin-top: 28px; }
      .choice { min-height: 160px; padding: 8px 5px; gap: 2px; border-radius: 21px; }
      .person-photo { width: 92px; height: 145px; }
      .bride-photo { margin-left: -13px; margin-right: 0; }
      .groom-photo { margin-left: 0; margin-right: -13px; }
      .choice-title { font-size: 21px; }
      .choice-name { margin-top: 3px; font-size: 8px; letter-spacing: .08em; }
      .vs { width: 38px; height: 38px; font-size: 10px; }
      .answer-message { margin-top: 24px; }
      .controls { gap: 8px; margin-top: 22px; }
      .control-btn { flex: 1; min-width: 100px; padding: 13px 8px; }
      .btn-reveal { min-width: 140px; }
    }

    @media (max-width: 430px) {
      .choice { min-height: 145px; }
      .person-photo { width: 76px; height: 120px; }
      .choice-title { font-size: 19px; }
      .choice-name { display: none; }
      .question-card { padding-left: 10px; padding-right: 10px; }
    }
  </style>
</head>
<body>
  <div class="bg-deco">
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="flower f1">囍</div>
    <div class="flower f2">囍</div>
  </div>

  <main id="homePage" class="page">
    <section class="home-card">
      <div class="seal">囍</div>
      <div class="small-en">WEDDING QUICK QUIZ</div>
      <h1 class="home-title serif">婚禮<span class="accent">快問快答</span></h1>
      <p class="home-subtitle">關於他們的日常大小事，<br>到底誰才是真正的那一位？</p>

      <div class="couple-row">
        <span class="couple-tag bride">新娘</span>
        <span class="heart">♥</span>
        <span class="couple-tag groom">新郎</span>
      </div>

      <button class="start-btn" onclick="startGame()">開始遊戲 <span>→</span></button>
    </section>
  </main>

  <main id="gamePage" class="page hidden">
    <div class="game-shell">
      <div class="topbar">
        <button class="home-mini-btn" onclick="goHome()" title="回首頁">←</button>

        <div class="progress-wrap">
          <div class="progress-info">
            <span>默契挑戰進行中</span>
            <span id="progressText">1 / 10</span>
          </div>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        </div>

        <div id="questionCounter" class="question-counter">Q01</div>
      </div>

      <section class="question-card">
        <div class="q-label"><span>✦ QUESTION ✦</span></div>
        <h2 id="questionText" class="question">平常家裡都是誰在做家事？</h2>

        <div class="choices">
          <!-- 新娘：左邊 -->
          <div id="brideChoice" class="choice choice-bride">
            <img src="./bride.png" alt="新娘" class="person-photo bride-photo">
            <div class="person-info bride-info">
              <div class="choice-title">新娘</div>
              <div class="choice-name">BRIDE</div>
            </div>
          </div>

          <div class="vs">VS</div>

          <!-- 新郎：右邊 -->
          <div id="groomChoice" class="choice choice-groom">
            <div class="person-info groom-info">
              <div class="choice-title">新郎</div>
              <div class="choice-name">GROOM</div>
            </div>
            <img src="./groom.png" alt="新郎" class="person-photo groom-photo">
          </div>
        </div>

        <div id="answerMessage" class="answer-message hidden">
          <div class="answer-title">THE ANSWER IS</div>
          <div id="answerResult" class="answer-result"></div>
          <div id="answerNote" class="answer-note"></div>
        </div>

        <div class="controls">
          <button id="prevBtn" class="control-btn btn-secondary" onclick="prevQuestion()">← 上一題</button>
          <button id="revealBtn" class="control-btn btn-reveal" onclick="revealAnswer()">揭曉答案</button>
          <button id="nextBtn" class="control-btn btn-next" onclick="nextQuestion()">下一題 →</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const questions = [
      { question: "平常家裡都是誰在做家事？", answer: "bride", note: "家事擔當，實至名歸。" },
      { question: "誰出門前準備的時間比較久？", answer: "bride", note: "精緻是需要時間的。" },
      { question: "誰比較容易迷路？", answer: "groom", note: "導航有時候也救不了。" },
      { question: "誰比較會亂買東西？", answer: "bride", note: "這不是亂買，是生活需要。" },
      { question: "吵架之後通常誰先低頭？", answer: "groom", note: "求生欲，非常優秀。" },
      { question: "誰比較會忘東忘西？", answer: "groom", note: "記憶體偶爾需要重新整理。" },
      { question: "誰比較愛吃宵夜？", answer: "bride", note: "晚上十點只是晚餐第二場。" },
      { question: "誰比較常說「都可以」？", answer: "groom", note: "都可以，但選錯可能不可以。" },
      { question: "誰比較容易睡著？", answer: "groom", note: "三、二、一，晚安。" },
      { question: "誰比較愛對方？", answer: "both", note: "這題就不要比了啦 ♥" }
    ];

    let currentQuestion = 0;
    let revealed = false;

    const $ = id => document.getElementById(id);

    function startGame() {
      $("homePage").classList.add("hidden");
      $("gamePage").classList.remove("hidden");
      currentQuestion = 0;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      $("gamePage").classList.add("hidden");
      $("homePage").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      const data = questions[currentQuestion];
      const index = currentQuestion + 1;
      revealed = false;

      $("questionText").textContent = data.question;
      $("questionCounter").textContent = `Q${String(index).padStart(2, "0")}`;
      $("progressText").textContent = `${index} / ${questions.length}`;
      $("progressFill").style.width = `${(index / questions.length) * 100}%`;
      $("prevBtn").disabled = currentQuestion === 0;
      $("nextBtn").textContent = currentQuestion === questions.length - 1 ? "完成 ♥" : "下一題 →";

      resetAnswer();
    }

    function resetAnswer() {
      [$("brideChoice"), $("groomChoice")].forEach(el => el.classList.remove("answer", "wrong"));
      $("answerMessage").classList.add("hidden");
      $("revealBtn").disabled = false;
    }

    function revealAnswer() {
      if (revealed) return;
      revealed = true;

      const { answer, note } = questions[currentQuestion];
      const bride = $("brideChoice");
      const groom = $("groomChoice");

      if (answer === "bride") {
        bride.classList.add("answer");
        groom.classList.add("wrong");
        $("answerResult").textContent = "新娘！";
      } else if (answer === "groom") {
        groom.classList.add("answer");
        bride.classList.add("wrong");
        $("answerResult").textContent = "新郎！";
      } else {
        bride.classList.add("answer");
        groom.classList.add("answer");
        $("answerResult").textContent = "兩個都是 ♥";
      }

      $("answerNote").textContent = note || "";
      $("answerMessage").classList.remove("hidden");
      $("revealBtn").disabled = true;
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        goHome();
      }
    }

    function prevQuestion() {
      if (currentQuestion === 0) return;
      currentQuestion--;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("keydown", event => {
      if ($("gamePage").classList.contains("hidden")) return;
      if (event.key === "ArrowRight") nextQuestion();
      if (event.key === "ArrowLeft") prevQuestion();
      if (event.code === "Space") {
        event.preventDefault();
        revealAnswer();
      }
    });
  </script>
</body>
</html>
