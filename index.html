<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>莊滿禛心 · 婚禮快問快答</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Noto+Serif+TC:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #c83b46;
      --red-dark: #922c36;
      --red-soft: #e88783;
      --orange: #df7441;
      --yellow: #e7b74f;
      --green: #58755d;
      --cream: #fff8e9;
      --paper: #fffdf6;
      --ink: #2f2924;
      --ink-light: #71645a;
      --gold: #c79643;
      --shadow: 0 22px 60px rgba(91, 55, 37, 0.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Noto Sans TC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 10%, rgba(231, 183, 79, .20), transparent 28%),
        radial-gradient(circle at 92% 84%, rgba(200, 59, 70, .11), transparent 30%),
        linear-gradient(180deg, #fffaf0 0%, #fff4df 100%);
      overflow-x: hidden;
    }

    button { font: inherit; }
    .hidden { display: none !important; }
    .serif { font-family: "Noto Serif TC", serif; }

    /* ---------- 背景 ---------- */
    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .moon {
      position: absolute;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      right: -125px;
      top: -110px;
      background: radial-gradient(circle, rgba(231,183,79,.16), rgba(231,183,79,.03) 65%, transparent 66%);
    }

    .cloud {
      position: absolute;
      width: 260px;
      height: 90px;
      opacity: .08;
      border-top: 3px solid var(--red);
      border-radius: 50%;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-top: 3px solid var(--red);
      border-radius: 50%;
    }

    .cloud::before { width: 120px; height: 60px; left: 18px; top: -28px; }
    .cloud::after { width: 150px; height: 70px; right: 20px; top: -36px; }
    .cloud.c1 { left: -70px; top: 18%; transform: rotate(-8deg); }
    .cloud.c2 { right: 8%; bottom: 8%; transform: rotate(7deg) scale(.8); opacity: .06; }

    .window-grid {
      position: absolute;
      left: 3%;
      bottom: 5%;
      width: 180px;
      height: 180px;
      opacity: .045;
      background:
        linear-gradient(90deg, var(--green) 2px, transparent 2px) 0 0 / 30px 30px,
        linear-gradient(var(--green) 2px, transparent 2px) 0 0 / 30px 30px;
      transform: rotate(8deg);
    }

    /* ---------- 共用 ---------- */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      width: 100%;
    }

    /* ---------- 首頁 ---------- */
    #homePage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px 20px;
    }

    .home-card {
      width: min(920px, 100%);
      min-height: 650px;
      padding: 68px 34px;
      border: 1px solid rgba(151, 82, 57, .14);
      border-radius: 38px;
      background: rgba(255, 253, 246, .92);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .home-card::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(200,59,70,.10);
      border-radius: 28px;
      pointer-events: none;
    }

    .home-card::after {
      content: "莊滿禛心";
      position: absolute;
      right: -16px;
      bottom: -72px;
      font: 900 92px/1 "Noto Serif TC", serif;
      color: rgba(200, 59, 70, .035);
    }

    .seal {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin-bottom: 26px;
      color: #fff;
      background: var(--red);
      border-radius: 18px 18px 28px 18px;
      box-shadow: 7px 8px 0 rgba(151,45,57,.12);
      transform: rotate(-4deg);
      font: 900 43px/1 "Noto Serif TC", serif;
      animation: sealFloat 3s ease-in-out infinite;
    }

    @keyframes sealFloat {
      50% { transform: rotate(-2deg) translateY(-5px); }
    }

    .brand-seal {
      width: auto;
      min-width: 168px;
      height: 74px;
      padding: 0 22px;
      border-radius: 18px 18px 26px 18px;
      font-size: 28px;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .home-tagline {
      margin-top: 10px;
      color: var(--green);
      font: 800 clamp(18px, 2.6vw, 26px)/1.4 "Noto Serif TC", serif;
      letter-spacing: .08em;
    }


    /* ---------- 封面品牌題字 ---------- */
    .brand-lockup {
      position: relative;
      z-index: 4;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand-title {
      position: relative;
      color: var(--red-dark);
      font: 900 clamp(30px, 4vw, 44px)/1.15 "Noto Serif TC", serif;
      letter-spacing: .16em;
      padding-left: .16em;
      white-space: nowrap;
    }

    .mini-seal {
      position: absolute;
      right: -31px;
      top: -11px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: #fffaf0;
      background: var(--red);
      border: 1px solid rgba(130, 35, 45, .28);
      font: 900 15px/1 "Noto Serif TC", serif;
      letter-spacing: 0;
      transform: rotate(5deg);
      box-shadow: 2px 3px 0 rgba(151, 45, 57, .10);
    }

    .brand-line {
      width: 78%;
      height: 1px;
      margin-top: 13px;
      background: linear-gradient(90deg, transparent, rgba(199,150,69,.78), transparent);
    }

    /* ---------- 封面左右人物 ---------- */
    .cover-photo {
      position: fixed;
      bottom: 0;
      width: clamp(420px, 34vw, 660px);
      height: min(92vh, 900px);
      z-index: 1;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      opacity: 1;
    }

    .cover-photo-left {
      left: clamp(-55px, -2vw, 15px);
      justify-content: flex-start;
    }

    .cover-photo-right {
      right: clamp(-150px, -6vw, -55px);
      justify-content: flex-end;
    }

    .cover-photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      transform: scale(1.32);
      transform-origin: bottom center;
      filter: drop-shadow(0 18px 22px rgba(55,38,28,.12));
    }

    /* 沒放圖片時完全隱藏，不會顯示破圖 */
    .cover-photo.photo-empty { display: none; }

    /* 中央文案永遠在人物前方 */
    .home-card > :not(.cover-photo) {
      position: relative;
      z-index: 3;
    }

    .home-kicker {
      color: var(--red);
      letter-spacing: .24em;
      font-size: 12px;
      font-weight: 800;
    }

    .home-title {
      margin: 9px 0 5px;
      font: 900 clamp(42px, 7vw, 76px)/1.15 "Noto Serif TC", serif;
      letter-spacing: .08em;
    }

    .home-title span { color: var(--red); }

    .home-subtitle {
      margin: 20px auto 24px;
      max-width: 620px;
      color: var(--ink-light);
      font-size: 17px;
      line-height: 1.9;
    }

    .versus-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(48,41,35,.055);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .versus-pill .bride { color: var(--red); }
    .versus-pill .groom { color: var(--green); }
    .versus-pill b { color: var(--gold); }

    .start-btn {
      min-width: 255px;
      padding: 18px 34px;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      box-shadow: 0 13px 28px rgba(200,59,70,.24);
      cursor: pointer;
      font-size: 17px;
      font-weight: 800;
      transition: .22s ease;
    }

    .start-btn:hover { transform: translateY(-3px); box-shadow: 0 18px 34px rgba(200,59,70,.28); }


    /* ---------- 封面新中式裝飾 ---------- */
    #homePage::before,
    #homePage::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    /* 左上竹葉感 */
    #homePage::before {
      left: -24px;
      top: -18px;
      width: 250px;
      height: 250px;
      opacity: .10;
      background:
        linear-gradient(28deg, transparent 47%, rgba(165,122,52,.85) 48% 50%, transparent 51%) 45px 20px / 145px 16px no-repeat,
        linear-gradient(65deg, transparent 44%, rgba(165,122,52,.62) 45% 57%, transparent 58%) 38px 42px / 42px 92px no-repeat,
        linear-gradient(65deg, transparent 44%, rgba(165,122,52,.52) 45% 57%, transparent 58%) 78px 58px / 40px 88px no-repeat,
        linear-gradient(65deg, transparent 44%, rgba(165,122,52,.45) 45% 57%, transparent 58%) 118px 78px / 38px 82px no-repeat;
      transform: rotate(-14deg);
    }

    /* 右上暖紅圓日 */
    #homePage::after {
      right: 68px;
      top: 38px;
      width: 135px;
      height: 135px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(225,118,94,.28), rgba(200,59,70,.16) 62%, rgba(200,59,70,.06) 100%);
      box-shadow: 0 0 50px rgba(200,59,70,.08);
    }

    .home-card {
      isolation: isolate;
    }

    .home-card .brand-lockup::after {
      content: "✦";
      display: block;
      margin-top: 10px;
      color: rgba(199,150,67,.75);
      font-size: 13px;
      letter-spacing: .6em;
      transform: translateX(.3em);
    }

    .home-card .brand-line {
      width: 86%;
      margin-top: 10px;
    }

    .home-card::before {
      box-shadow:
        0 0 0 1px rgba(199,150,67,.04),
        inset 0 0 80px rgba(255,248,230,.22);
    }

    .home-card .start-btn {
      border: 1px solid rgba(199,150,67,.52);
      box-shadow:
        0 13px 28px rgba(200,59,70,.22),
        0 0 0 4px rgba(255,249,236,.72);
    }

    /* 底部波紋 */
    #homePage .home-card::after {
      content: "";
      left: 0;
      right: 0;
      bottom: -8px;
      top: auto;
      height: 110px;
      font: inherit;
      background:
        radial-gradient(circle at 25px 80px, transparent 23px, rgba(199,150,67,.10) 24px 26px, transparent 27px) 0 0 / 50px 50px repeat-x,
        radial-gradient(circle at 25px 88px, transparent 23px, rgba(200,59,70,.05) 24px 26px, transparent 27px) 25px 8px / 50px 50px repeat-x;
      opacity: .55;
      z-index: 0;
      pointer-events: none;
    }

    /* ---------- 遊戲頁 ---------- */
    #gamePage { padding: 22px; }

    .game-shell {
      width: min(1200px, 100%);
      min-height: calc(100vh - 44px);
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .home-mini-btn {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 15px;
      background: rgba(255,255,255,.78);
      color: var(--ink);
      box-shadow: 0 7px 20px rgba(70,49,36,.08);
      cursor: pointer;
      transition: .2s ease;
    }

    .home-mini-btn:hover { transform: translateY(-2px); }

    .progress-wrap { flex: 1; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--ink-light);
      font-size: 12px;
      font-weight: 700;
    }

    .progress-bar {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(93,75,59,.09);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow));
      transition: width .45s ease;
    }

    .question-counter {
      min-width: 78px;
      text-align: right;
      color: var(--red);
      font: 800 15px/1 "Noto Serif TC", serif;
    }

    .question-card {
      flex: 1;
      min-height: 680px;
      padding: 36px 42px 28px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(103,72,47,.12);
      border-radius: 32px;
      background: rgba(255,253,246,.94);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question-card::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(200,59,70,.07);
      border-radius: 24px;
      pointer-events: none;
    }

    .question-card::after {
      content: "囍";
      position: absolute;
      right: 10px;
      top: -38px;
      color: rgba(200,59,70,.035);
      font: 900 210px/1 "Noto Serif TC", serif;
    }

    .round-row {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .round-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--red);
      background: rgba(200,59,70,.09);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .question {
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      font: 800 clamp(27px, 4.5vw, 48px)/1.5 "Noto Serif TC", serif;
    }

    .question.animate { animation: questionIn .55s cubic-bezier(.2,.8,.2,1); }

    @keyframes questionIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- 人物舞台 ---------- */
    .stage {
      position: relative;
      z-index: 2;
      width: min(1120px, 100%);
      margin: 30px auto 0;
      display: grid;
      grid-template-columns: 1fr 86px 1fr;
      align-items: end;
      gap: 24px;
    }

    .person-side {
      min-height: 330px;
      position: relative;
      display: flex;
      align-items: flex-end;
      border-radius: 30px;
      transition: opacity .35s ease, transform .35s ease, filter .35s ease;
    }

    .person-side::before {
      content: "";
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 4px;
      height: 125px;
      border-radius: 50% 50% 28px 28px;
      opacity: .8;
    }

    .bride-side { justify-content: flex-start; }
    .groom-side { justify-content: flex-end; }
    .bride-side::before { background: linear-gradient(180deg, rgba(200,59,70,.14), rgba(200,59,70,.04)); }
    .groom-side::before { background: linear-gradient(180deg, rgba(88,117,93,.15), rgba(88,117,93,.04)); }

    .person-photo {
      width: 290px;
      height: 340px;
      object-fit: contain;
      object-position: bottom center;
      position: relative;
      z-index: 3;
      flex-shrink: 0;
      filter: drop-shadow(0 16px 14px rgba(55,38,28,.17));
      transition: transform .38s cubic-bezier(.2,.8,.2,1), filter .38s ease;
    }

    .bride-photo { margin-left: -5px; margin-right: 8px; }
    .groom-photo { margin-left: 8px; margin-right: -5px; }

    .person-info {
      position: relative;
      z-index: 4;
      min-width: 150px;
      padding-bottom: 66px;
    }

    .bride-info { text-align: left; }
    .groom-info { text-align: right; }

    .choice-title {
      font: 900 46px/1.15 "Noto Serif TC", serif;
      letter-spacing: .05em;
    }

    .bride-side .choice-title { color: var(--red-dark); }
    .groom-side .choice-title { color: #425c49; }

    .choice-name {
      margin-top: 9px;
      color: var(--ink-light);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .22em;
    }

    .vs-wrap {
      height: 100%;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 5;
    }

    .vs {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--ink);
      box-shadow: 0 8px 18px rgba(48,41,35,.16);
      font: 800 14px/1 "Noto Serif TC", serif;
    }

    .bride-side.enter { animation: brideIn .65s cubic-bezier(.18,.85,.25,1); }
    .groom-side.enter { animation: groomIn .65s cubic-bezier(.18,.85,.25,1); }

    @keyframes brideIn {
      from { opacity: 0; transform: translateX(-45px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes groomIn {
      from { opacity: 0; transform: translateX(45px); }
      to { opacity: 1; transform: translateX(0); }
    }


    /* ---------- 關卡提醒 ---------- */
    .stage-intro-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 34%, rgba(231,183,79,.14), transparent 34%),
        rgba(255,249,237,.94);
      backdrop-filter: blur(7px);
    }

    .stage-intro-card {
      width: min(620px, 100%);
      padding: 48px 36px 42px;
      border: 1px solid rgba(199,150,67,.24);
      border-radius: 30px;
      background: rgba(255,253,246,.96);
      box-shadow: 0 20px 60px rgba(91,55,37,.13);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: stageIntroIn .55s cubic-bezier(.2,.85,.25,1);
    }

    .stage-intro-card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(200,59,70,.08);
      border-radius: 22px;
      pointer-events: none;
    }

    .stage-intro-card::after {
      content: "囍";
      position: absolute;
      right: -8px;
      bottom: -55px;
      color: rgba(200,59,70,.035);
      font: 900 180px/1 "Noto Serif TC", serif;
    }

    .stage-intro-eyebrow {
      position: relative;
      z-index: 2;
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .24em;
    }

    .stage-intro-title {
      position: relative;
      z-index: 2;
      margin: 0;
      color: var(--red-dark);
      font: 900 clamp(34px, 6vw, 52px)/1.2 "Noto Serif TC", serif;
      letter-spacing: .08em;
    }

    .stage-intro-subtitle {
      position: relative;
      z-index: 2;
      margin: 18px auto 0;
      max-width: 470px;
      color: var(--ink-light);
      font-size: 16px;
      line-height: 1.9;
    }

    .stage-intro-count {
      position: relative;
      z-index: 2;
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      margin: 20px auto 0;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--green);
      background: rgba(88,117,93,.08);
      font-size: 12px;
      font-weight: 800;
    }

    .stage-intro-btn {
      position: relative;
      z-index: 2;
      display: block;
      min-width: 180px;
      margin: 18px auto 0;
      padding: 14px 24px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      box-shadow: 0 10px 22px rgba(200,59,70,.20);
      cursor: pointer;
      font-weight: 800;
      transition: .2s ease;
    }

    .stage-intro-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(200,59,70,.25);
    }

    @keyframes stageIntroIn {
      from { opacity: 0; transform: translateY(18px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 760px) {
      .stage-intro-overlay { padding: 16px; }
      .stage-intro-card { padding: 38px 22px 34px; border-radius: 24px; }
      .stage-intro-subtitle { font-size: 14px; }
    }

    /* ---------- 倒數與揭曉 ---------- */
    .countdown-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(255,249,237,.82);
      backdrop-filter: blur(4px);
    }

    .countdown-number {
      color: var(--red);
      text-shadow: 0 12px 30px rgba(200,59,70,.16);
      font: 900 clamp(90px, 18vw, 180px)/1 "Noto Serif TC", serif;
      animation: countPop .65s cubic-bezier(.17,.86,.26,1);
    }

    @keyframes countPop {
      0% { opacity: 0; transform: scale(.55); }
      65% { opacity: 1; transform: scale(1.12); }
      100% { opacity: 1; transform: scale(1); }
    }

    .person-side.answer {
      transform: translateY(-8px) scale(1.035);
      filter: saturate(1.08);
    }

    .person-side.answer .choice-title {
      text-shadow: 0 0 18px rgba(231, 183, 79, .32);
    }

    .person-side.answer .person-photo {
      transform: scale(1.11) translateY(-7px);
      filter: drop-shadow(0 22px 18px rgba(55,38,28,.22));
    }

    .person-side.wrong {
      opacity: .25;
      transform: scale(.96);
      filter: grayscale(.2);
    }

    .answer-stamp {
      position: absolute;
      top: 22px;
      z-index: 9;
      width: 78px;
      height: 78px;
      display: none;
      place-items: center;
      border: 4px solid var(--red);
      border-radius: 14px;
      color: var(--red);
      background: rgba(255,250,240,.88);
      font: 900 17px/1.15 "Noto Serif TC", serif;
      text-align: center;
      transform: rotate(-8deg);
      box-shadow: inset 0 0 0 3px rgba(200,59,70,.10);
    }

    .bride-side .answer-stamp { right: 24px; }
    .groom-side .answer-stamp { left: 24px; }
    .person-side.answer .answer-stamp { display: grid; animation: stampIn .45s cubic-bezier(.2,1.25,.3,1); }

    @keyframes stampIn {
      0% { opacity: 0; transform: rotate(-18deg) scale(1.7); }
      70% { opacity: 1; transform: rotate(-6deg) scale(.94); }
      100% { opacity: 1; transform: rotate(-8deg) scale(1); }
    }

    /* ---------- 正解半透明圓月 ---------- */
    .person-side::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 270px;
      height: 270px;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      border-radius: 50%;
      transform: translateX(-50%) scale(.72);
      background:
        radial-gradient(
          circle at 38% 34%,
          rgba(255, 253, 242, .68) 0 4%,
          transparent 5%
        ),
        radial-gradient(
          circle at 64% 58%,
          rgba(151, 121, 78, .035) 0 9%,
          transparent 10%
        ),
        linear-gradient(
          145deg,
          rgba(232, 214, 174, .34),
          rgba(211, 183, 127, .18)
        );
      border: 1px solid rgba(183, 145, 83, .13);
      box-shadow: inset 0 0 35px rgba(255, 250, 226, .30);
    }

    .person-side.answer::after {
      animation: moonReveal .78s cubic-bezier(.2,.82,.25,1) forwards;
    }

    @keyframes moonReveal {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(.72);
      }
      65% {
        opacity: .72;
        transform: translateX(-50%) scale(1.025);
      }
      100% {
        opacity: .58;
        transform: translateX(-50%) scale(1);
      }
    }

    .answer-message {
      position: relative;
      z-index: 3;
      margin: 22px auto 0;
      text-align: center;
      animation: answerIn .5s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes answerIn {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .answer-title {
      margin-bottom: 6px;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .22em;
    }

    .answer-result {
      font: 900 clamp(30px, 5vw, 44px)/1.25 "Noto Serif TC", serif;
    }

    .answer-note {
      margin-top: 7px;
      color: var(--ink-light);
      font-size: 14px;
    }

    /* ---------- 控制 ---------- */
    .controls {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .control-btn {
      padding: 13px 21px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: .2s ease;
    }

    .control-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .control-btn:disabled { opacity: .3; cursor: default; }
    .btn-secondary { color: var(--ink); background: rgba(48,41,35,.07); }
    .btn-reveal { min-width: 190px; color: #fff; background: var(--red); box-shadow: 0 10px 20px rgba(200,59,70,.20); }
    .btn-next { color: #fff; background: var(--green); }

    /* ---------- 手機 ---------- */
    @media (max-width: 760px) {
      #homePage { padding: 16px 12px; }
      .home-card { min-height: calc(100vh - 32px); padding: 48px 20px; border-radius: 28px; }
      #gamePage { padding: 12px; }
      .game-shell { min-height: calc(100vh - 24px); }
      .question-card { min-height: 650px; padding: 28px 12px 22px; border-radius: 26px; }
      .progress-info { display: none; }
      .question-counter { min-width: auto; }
      .question { font-size: clamp(24px, 8vw, 34px); }
      .stage { width: 100%; grid-template-columns: 1fr 42px 1fr; gap: 4px; margin-top: 24px; }
      .person-side { min-height: 205px; }
      .person-side::before { height: 80px; left: 2%; right: 2%; }
      .person-photo { width: 112px; height: 175px; }
      .bride-photo { margin-left: -10px; margin-right: -4px; }
      .groom-photo { margin-left: -4px; margin-right: -10px; }
      .person-info { min-width: 58px; padding-bottom: 36px; }
      .choice-title { font-size: 22px; }
      .choice-name { font-size: 8px; letter-spacing: .1em; }
      .vs { width: 40px; height: 40px; font-size: 10px; }
      .answer-stamp { width: 58px; height: 58px; font-size: 13px; line-height: 1.15; top: 14px; }
      .person-side::after { width: 150px; height: 150px; bottom: 14px; }
      .bride-side .answer-stamp { right: 4px; }
      .groom-side .answer-stamp { left: 4px; }
      .controls { gap: 7px; }
      .control-btn { flex: 1; min-width: 98px; padding: 12px 8px; }
      .btn-reveal { min-width: 138px; }
    }

    @media (max-width: 430px) {
      .brand-seal { min-width: 146px; height: 66px; padding: 0 16px; font-size: 24px; }
      .home-tagline { font-size: 18px; }
      .home-subtitle { font-size: 15px; }
      .question-card { min-height: 620px; }
      .person-photo { width: 92px; height: 155px; }
      .choice-title { font-size: 19px; }
      .choice-name { display: none; }
      .person-info { min-width: 45px; }
    }
  
    @media (max-width: 700px) {
      .brand-title { font-size: 29px; }
      .mini-seal { right: -25px; top: -9px; width: 24px; height: 24px; font-size: 13px; }

      .cover-photo {
        position: fixed;
        bottom: 0;
        width: 58vw;
        height: 48vh;
        opacity: .55;
        align-items: flex-end;
      }

      .cover-photo img {
        width: 100%;
        height: 100%;
        transform: scale(1.22);
        transform-origin: bottom center;
      }

      .cover-photo-left { left: -16vw; }
      .cover-photo-right { right: -23vw; }

      #homePage::before { width: 150px; height: 150px; opacity: .07; }
      #homePage::after { width: 80px; height: 80px; right: 18px; top: 18px; }
    }

</style>
</head>

<body>
  <div class="bg-deco" aria-hidden="true">
    <div class="moon"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="window-grid"></div>
  </div>

  <main id="homePage" class="page">
    <section class="home-card">
      <!-- 封面左右圖片預留：把檔案與 HTML 放同一層即可 -->
      <div class="cover-photo cover-photo-left">
        <img src="./cover-left.png" alt="" onerror="this.parentElement.classList.add('photo-empty')">
      </div>
      <div class="cover-photo cover-photo-right">
        <img src="./cover-right.png" alt="" onerror="this.parentElement.classList.add('photo-empty')">
      </div>
      <div class="brand-lockup">
        <div class="brand-title">莊滿禛心<span class="mini-seal">囍</span></div>
        <div class="brand-line"></div>
      </div>
      <div class="home-kicker">TIM & ARIES · WEDDING GAME</div>
      <h1 class="home-title">婚禮<span>快問快答</span></h1><div class="home-tagline">來都來了，應該很懂我們吧？</div>
      <p class="home-subtitle">認識我們這麼久，今天就來驗證一下你的熟悉程度。<br>15 題，看看你能撐到第幾關。</p>
      <div class="versus-pill"><span class="bride">ARIES</span><b>♥</b><span class="groom">TIM</span></div>
      <button class="start-btn" onclick="startGame()">開始挑戰 →</button>
    </section>
  </main>

  <main id="gamePage" class="page hidden">
    <div class="game-shell">
      <div class="topbar">
        <button class="home-mini-btn" onclick="goHome()" title="回首頁">←</button>
        <div class="progress-wrap">
          <div class="progress-info"><span>默契挑戰進行中</span><span id="progressText">1 / 10</span></div>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        </div>
        <div id="questionCounter" class="question-counter">Q01</div>
      </div>

      <section id="questionCard" class="question-card">
        <div id="stageIntroOverlay" class="stage-intro-overlay hidden">
          <div class="stage-intro-card">
            <div id="stageIntroEyebrow" class="stage-intro-eyebrow">STAGE 01</div>
            <h2 id="stageIntroTitle" class="stage-intro-title">暖身題</h2>
            <p id="stageIntroSubtitle" class="stage-intro-subtitle">先來幾題熱熱身，看看大家對我們到底熟不熟。</p>
            <div id="stageIntroCount" class="stage-intro-count">本關 3 題</div>
            <button class="stage-intro-btn" onclick="closeStageIntro()">開始這一關 →</button>
          </div>
        </div>

        <div id="countdownOverlay" class="countdown-overlay hidden">
          <div id="countdownNumber" class="countdown-number">3</div>
        </div>

        <div class="round-row">
          <div class="round-pill"><span id="roundLabel">ROUND 01</span><span>·</span><span id="categoryLabel">日常篇</span></div>
        </div>

        <h2 id="questionText" class="question">平常家裡都是誰在做家事？</h2>

        <div class="stage">
          <div id="brideChoice" class="person-side bride-side">
            <div class="answer-stamp">哈哈<br>是我啦</div>
            <img src="./bride.png" alt="新娘" class="person-photo bride-photo">
            <div class="person-info bride-info">
              <div class="choice-title">新娘</div>
              <div class="choice-name">BRIDE</div>
            </div>
          </div>

          <div class="vs-wrap"><div class="vs">VS</div></div>

          <div id="groomChoice" class="person-side groom-side">
            <div class="person-info groom-info">
              <div class="choice-title">新郎</div>
              <div class="choice-name">GROOM</div>
            </div>
            <img src="./groom.png" alt="新郎" class="person-photo groom-photo">
            <div class="answer-stamp">哈哈<br>是我啦</div>
          </div>
        </div>

        <div id="answerMessage" class="answer-message hidden">
          <div class="answer-title">THE ANSWER IS</div>
          <div id="answerResult" class="answer-result"></div>
          <div id="answerNote" class="answer-note"></div>
        </div>

        <div class="controls">
          <button id="prevBtn" class="control-btn btn-secondary" onclick="prevQuestion()">← 上一題</button>
          <button id="revealBtn" class="control-btn btn-reveal" onclick="revealAnswer()">揭曉答案</button>
          <button id="nextBtn" class="control-btn btn-next" onclick="nextQuestion()">下一題 →</button>
        </div>
      </section>
    </div>
  </main>

  <script>
    const stages = [
      {
        key: "warmup",
        start: 0,
        end: 2,
        label: "暖身題",
        eyebrow: "STAGE 01 · WARM UP",
        subtitle: "先來 3 題熱熱身，看看大家對我們到底熟不熟。",
        count: "本關 3 題"
      },
      {
        key: "normal",
        start: 3,
        end: 8,
        label: "一般題",
        eyebrow: "STAGE 02 · HERE WE GO",
        subtitle: "暖身結束，接下來正式開始。熟不熟，就看這一輪了！",
        count: "本關 6 題"
      },
      {
        key: "trap",
        start: 9,
        end: 11,
        label: "陷阱題",
        eyebrow: "STAGE 03 · TRAP",
        subtitle: "小心！接下來不能只靠直覺，有些答案可能跟你想的不一樣。",
        count: "本關 3 題"
      },
      {
        key: "boss",
        start: 12,
        end: 14,
        label: "魔王題",
        eyebrow: "FINAL STAGE · BOSS",
        subtitle: "接下來是魔王細節題～真正懂我們的人，才有辦法留下來！",
        count: "最後 3 題"
      }
    ];

    const questions = [
      /* ---------- 暖身題 1～3 ---------- */
      { question: "誰吃東西比較挑？", answer: "bride", note: "不是難搞，只是對食物有原則。" },
      { question: "誰比較沒耐心？", answer: "bride", note: "等待五分鐘，體感大約半小時。" },
      { question: "誰比較容易睡著？", answer: "groom", note: "吃飽睡覺絕對是必須。" },

      /* ---------- 一般題 4～9 ---------- */
      { question: "誰比較會製造驚喜？", answer: "bride", note: "另一位負責被驚喜就好。" },
      { question: "誰比較能吃辣？", answer: "groom", note: "你們的大辣，是她的正常辣。" },
      { question: "誰手機裡偷拍對方的醜照比較多？", answer: "groom", note: "這不是相簿，這是彼此的人質庫。" },
      { question: "誰喝醉之後比較失控？", answer: "bride", note: "內容因婚禮尺度限制，不便公開。" },
      { question: "吃麵的時候誰是軟麵派？", answer: "groom", note: "連這個都知道，才算自己人。" },

      /* ---------- 陷阱題 10～12 ---------- */
      { question: "從日常到工作，誰才是真正的細節控？", answer: "bride", note: "差一點點也是差，請不要挑戰她的眼睛。" },
      { question: "誰比較常去陽明山？", answer: "bride", note: "選錯的人是不是有什麼小秘密。" },
      { question: "誰出門前準備的時間比較久？", answer: "groom", note: "別催，催了也不會比較快。" },
      { question: "洗澡的時候，誰洗得比較久？", answer: "groom", note: "別問洗好了沒，問就是還沒。" },

      /* ---------- 魔王題 13～15 ---------- */
      { question: "兩個人之中，誰先追蹤對方的社群帳號？", answer: "groom", note: "這題開始，靠猜的可能不太夠用了。" },
      { question: "我們第一次交談，是誰先開頭的？", answer: "bride", note: "真正的老朋友，應該要知道吧？" },
      { question: "誰先把對方帶回家見家人？", answer: "groom", note: "這題都知道，可以坐主桌了。" }
    ];

    function getStageByQuestionIndex(index) {
      return stages.find(stage => index >= stage.start && index <= stage.end) || stages[0];
    }

    function isStageStart(index) {
      return stages.some(stage => stage.start === index);
    }

    function showStageIntro() {
      const stage = getStageByQuestionIndex(currentQuestion);
      $("stageIntroEyebrow").textContent = stage.eyebrow;
      $("stageIntroTitle").textContent = stage.label;
      $("stageIntroSubtitle").textContent = stage.subtitle;
      $("stageIntroCount").textContent = stage.count;
      $("stageIntroOverlay").classList.remove("hidden");
    }

    function closeStageIntro() {
      $("stageIntroOverlay").classList.add("hidden");
      retrigger($("questionText"), "animate");
      retrigger($("brideChoice"), "enter");
      retrigger($("groomChoice"), "enter");
    }

    let currentQuestion = 0;
    let revealed = false;
    let revealing = false;

    const $ = id => document.getElementById(id);

    function startGame() {
      $("homePage").classList.add("hidden");
      $("gamePage").classList.remove("hidden");
      currentQuestion = 0;
      renderQuestion();
      showStageIntro();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      $("gamePage").classList.add("hidden");
      $("homePage").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestion() {
      const data = questions[currentQuestion];
      const number = String(currentQuestion + 1).padStart(2, "0");
      const percent = ((currentQuestion + 1) / questions.length) * 100;

      revealed = false;
      revealing = false;
      resetAnswer();

      $("questionText").textContent = data.question;
      $("questionCounter").textContent = `Q${number}`;
      $("progressText").textContent = `${currentQuestion + 1} / ${questions.length}`;
      $("progressFill").style.width = `${percent}%`;
      const stage = getStageByQuestionIndex(currentQuestion);
      $("roundLabel").textContent = `ROUND ${number}`;
      $("categoryLabel").textContent = stage.label;
      $("prevBtn").disabled = currentQuestion === 0;
      $("nextBtn").textContent = currentQuestion === questions.length - 1 ? "完成 ♥" : "下一題 →";

      retrigger($("questionText"), "animate");
      retrigger($("brideChoice"), "enter");
      retrigger($("groomChoice"), "enter");
    }

    function retrigger(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    function resetAnswer() {
      [$("brideChoice"), $("groomChoice")].forEach(el => el.classList.remove("answer", "wrong", "enter"));
      $("answerMessage").classList.add("hidden");
      $("countdownOverlay").classList.add("hidden");
      $("stageIntroOverlay").classList.add("hidden");
      $("revealBtn").disabled = false;
      $("prevBtn").disabled = currentQuestion === 0;
      $("nextBtn").disabled = false;
    }

    async function revealAnswer() {
      if (revealed || revealing) return;

      revealing = true;
      $("revealBtn").disabled = true;
      $("prevBtn").disabled = true;
      $("nextBtn").disabled = true;

      for (const number of [3, 2, 1]) {
        $("countdownNumber").textContent = number;
        $("countdownOverlay").classList.remove("hidden");
        retrigger($("countdownNumber"), "countdown-number");
        await wait(620);
      }

      $("countdownOverlay").classList.add("hidden");
      showAnswer();

      revealed = true;
      revealing = false;
      $("prevBtn").disabled = currentQuestion === 0;
      $("nextBtn").disabled = false;
    }

    function showAnswer() {
      const data = questions[currentQuestion];
      const bride = $("brideChoice");
      const groom = $("groomChoice");

      if (data.answer === "bride") {
        bride.classList.add("answer");
        groom.classList.add("wrong");
        $("answerResult").textContent = "答案是——新娘！";
      } else if (data.answer === "groom") {
        groom.classList.add("answer");
        bride.classList.add("wrong");
        $("answerResult").textContent = "答案是——新郎！";
      } else {
        bride.classList.add("answer");
        groom.classList.add("answer");
        $("answerResult").textContent = "答案是——兩個都是 ♥";
      }

      $("answerNote").textContent = data.note || "";
      $("answerMessage").classList.remove("hidden");
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function nextQuestion() {
      if (revealing) return;
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
        if (isStageStart(currentQuestion)) showStageIntro();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        goHome();
      }
    }

    function prevQuestion() {
      if (revealing || currentQuestion === 0) return;
      currentQuestion--;
      renderQuestion();
      if (isStageStart(currentQuestion)) showStageIntro();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("keydown", event => {
      if ($("gamePage").classList.contains("hidden") || revealing) return;

      if (!$("stageIntroOverlay").classList.contains("hidden")) {
        if (event.code === "Space" || event.key === "Enter") {
          event.preventDefault();
          closeStageIntro();
        }
        return;
      }

      if (event.key === "ArrowRight") nextQuestion();
      if (event.key === "ArrowLeft") prevQuestion();
      if (event.code === "Space") {
        event.preventDefault();
        revealAnswer();
      }
    });
  </script>
</body>
</html>
